id = "magus/dictation"
name = "Dictation"
version = "0.3.0"
plugin_api = 24
author = "magus"
license = "MIT"
dependencies = ["python3", "pw-dump", "pw-record", "pw-play", "hyprctl", "ps", "transcribe-cli"]
tags = ["audio", "dictation", "recording", "service", "panel"]
icon = "microphone"
description = "Records the microphone you choose and transcribes the recording with an installed recognition engine and GGUF model."

[[setting]]
key = "engine"
type = "file"
label_key = "settings.engine.label"
description_key = "settings.engine.description"
default = ""

[[setting]]
key = "model"
type = "file"
label_key = "settings.model.label"
description_key = "settings.model.description"
default = ""
extensions = [".gguf"]

[[setting]]
key = "recording"
type = "file"
label_key = "settings.recording.label"
description_key = "settings.recording.description"
default = ""
extensions = [".wav"]

[[setting]]
key = "threads"
type = "int"
label_key = "settings.threads.label"
description_key = "settings.threads.description"
default = 4
min = 1
max = 64

# How many finished dictations stay on disk. Pruning runs only after a newer
# dictation's own result is committed, so a failed or interrupted job is never
# silently removed to make room for one that did not finish.
[[setting]]
key = "retention"
type = "int"
label_key = "settings.retention.label"
description_key = "settings.retention.description"
default = 10
min = 1
max = 1000

# Delivery is one mechanism, not a fallback matrix: the transcript is copied and
# the ordinary paste chord is dispatched by the compositor through hyprctl,
# rootless, in the user's own session. Manual copy is a deliberate preference and
# the recovery route.
[[setting]]
key = "delivery"
type = "select"
label_key = "settings.delivery.label"
description_key = "settings.delivery.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.delivery.auto" },
  { value = "manual", label_key = "settings.delivery.manual" },
]

[[service]]
id = "controller"
entry = "controller.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 460
height = 620
placement = "floating"
position = "center"
open_near_click = true

[[widget]]
id = "widget"
entry = "widget.luau"
