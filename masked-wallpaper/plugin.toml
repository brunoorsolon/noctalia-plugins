id = "magus/masked-wallpaper"
name = "Masked Wallpaper Backdrop"
version = "0.2.0"
plugin_api = 25
author = "magus"
license = "MIT"
dependencies = ["imagemagick"]
tags = ["wallpaper", "service", "theming"]
icon = "photo"
description = "Keeps a blurred, tinted, decorated lockscreen backdrop in sync with the wallpaper."

[[setting]]
key = "mask_preset"
type = "select"
label_key = "settings.mask_preset.label"
description_key = "settings.mask_preset.description"
default = "center-glow"
options = [
  { value = "center-glow", label_key = "settings.mask_preset.center_glow" },
  { value = "left-panel", label_key = "settings.mask_preset.left_panel" },
  { value = "right-panel", label_key = "settings.mask_preset.right_panel" },
  { value = "facet", label_key = "settings.mask_preset.facet" },
  { value = "custom", label_key = "settings.mask_preset.custom" },
]

[[setting]]
key = "shape"
type = "file"
label_key = "settings.shape.label"
description_key = "settings.shape.description"
default = ""
extensions = [".png"]
visible_when = { key = "mask_preset", values = ["custom"] }

[[setting]]
key = "blur"
type = "int"
label_key = "settings.blur.label"
description_key = "settings.blur.description"
default = 60
min = 0
max = 100

[[setting]]
key = "tint"
type = "color"
label_key = "settings.tint.label"
description_key = "settings.tint.description"
default = "on_primary"

[[setting]]
key = "tint_intensity"
type = "int"
label_key = "settings.tint_intensity.label"
description_key = "settings.tint_intensity.description"
default = 30
min = 0
max = 100

[[setting]]
key = "decoration_1"
type = "file"
label_key = "settings.decoration_1.label"
description_key = "settings.decoration.description"
default = ""

[[setting]]
key = "colorize_1"
type = "bool"
label_key = "settings.colorize.label"
description_key = "settings.colorize.description"
default = false

[[setting]]
key = "color_1"
type = "color"
label_key = "settings.color.label"
description_key = "settings.color.description"
default = "primary"
visible_when = { key = "colorize_1", values = ["true"] }

[[setting]]
key = "decoration_2"
type = "file"
label_key = "settings.decoration_2.label"
description_key = "settings.decoration.description"
default = ""

[[setting]]
key = "colorize_2"
type = "bool"
label_key = "settings.colorize.label"
description_key = "settings.colorize.description"
default = false

[[setting]]
key = "color_2"
type = "color"
label_key = "settings.color.label"
description_key = "settings.color.description"
default = "tertiary"
visible_when = { key = "colorize_2", values = ["true"] }

[[setting]]
key = "decoration_3"
type = "file"
label_key = "settings.decoration_3.label"
description_key = "settings.decoration.description"
default = ""

[[setting]]
key = "colorize_3"
type = "bool"
label_key = "settings.colorize.label"
description_key = "settings.colorize.description"
default = false

[[setting]]
key = "color_3"
type = "color"
label_key = "settings.color.label"
description_key = "settings.color.description"
default = "secondary"
visible_when = { key = "colorize_3", values = ["true"] }

[[setting]]
key = "dest_dir"
type = "folder"
label_key = "settings.dest_dir.label"
description_key = "settings.dest_dir.description"
default = ""

[[service]]
id = "sync"
entry = "backdrop.luau"
