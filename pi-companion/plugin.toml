id = "magus/pi-companion"
name = "Pi Companion"
version = "0.5.0"
plugin_api = 24
author = "magus"
license = "MIT"
dependencies = ["hyprctl", "foot", "pi"]
tags = ["hyprland", "desktop", "widget", "agent"]
icon = "terminal-2"
description = "Your desktop agent companion, powered by Pi. Keeps one long-lived Pi TUI a shortcut away, shows its working, waiting or idle state, and notifies when Pi needs you out of sight."

[[setting]]
key = "workspace"
type = "string"
label_key = "settings.workspace.label"
description_key = "settings.workspace.description"
default = "pi"

[[setting]]
key = "terminal"
type = "string"
label_key = "settings.terminal.label"
description_key = "settings.terminal.description"
default = "foot"

[[setting]]
key = "spawn"
type = "string"
label_key = "settings.spawn.label"
description_key = "settings.spawn.description"
default = "pi -c --session-dir ~/.local/state/pi-companion/sessions"

[[setting]]
key = "working_dir"
type = "folder"
label_key = "settings.working_dir.label"
description_key = "settings.working_dir.description"
default = "~"

[[setting]]
key = "geometry"
type = "string"
label_key = "settings.geometry.label"
description_key = "settings.geometry.description"
default = "900x600"

[[setting]]
key = "vertical_alignment"
type = "select"
label_key = "settings.vertical_alignment.label"
description_key = "settings.vertical_alignment.description"
default = "center"
options = [
  { value = "top", label_key = "settings.vertical_alignment.top" },
  { value = "center", label_key = "settings.alignment.center" },
  { value = "bottom", label_key = "settings.vertical_alignment.bottom" },
]

[[setting]]
key = "horizontal_alignment"
type = "select"
label_key = "settings.horizontal_alignment.label"
description_key = "settings.horizontal_alignment.description"
default = "center"
options = [
  { value = "left", label_key = "settings.horizontal_alignment.left" },
  { value = "center", label_key = "settings.alignment.center" },
  { value = "right", label_key = "settings.horizontal_alignment.right" },
]

[[setting]]
key = "notify"
type = "bool"
label_key = "settings.notify.label"
description_key = "settings.notify.description"
default = true

[[widget]]
id = "companion"
entry = "companion.luau"
